<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login – Hospital Queue Management System</title>
  <link rel="stylesheet" href="style.css">

  <!-- Styles used only by this page -->
  <style>
    .lw {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #0b3b4a, #0f766e 60%, #134e4a);
    }

    .lb {
      background: #fff;
      padding: 32px;
      border-radius: 16px;
      width: 360px;
      box-shadow: 0 12px 40px #0006;
      border-top: 5px solid #5eead4;
    }

    .lb h2 {
      text-align: center;
      margin: 0;
      font-size: 22px;
      color: #0f766e;
    }

    .lb .sub {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      margin: 4px 0 18px;
    }

    .err {
      color: #b91c1c;
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="lw">
    <form class="lb" id="f">

      <!-- System name -->
      <h2>🏥 Hospital Queue Management System</h2>
      <p class="sub">Admin Login</p>

      <!-- Login fields -->
      <label>Email</label>
      <input id="email" type="email" required>

      <label>Password</label>
      <input id="pw" type="password" required>

      <button class="btn blue wide" id="go">Log in</button>
      <div class="err" id="err"></div>

      <!-- Opens the public display in a new tab -->
      <p style="text-align:center; font-size:13px;">
        <a href="display.html" target="_blank" rel="noopener"
           style="color:#0f766e; font-weight:600;">View display screen</a>
      </p>

    </form>
  </div>

  <!-- ===== Scripts (order matters) ===== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script>
    // If already logged in, go straight to the admin page
    db.auth.getSession().then(({ data }) => {
      if (data.session) location.replace('index.html');
    });

    // Log in with email + password
    document.getElementById('f').onsubmit = async e => {
      e.preventDefault();

      const go = document.getElementById('go');
      go.disabled = true;
      go.textContent = 'Logging in...';

      const { error } = await db.auth.signInWithPassword({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('pw').value
      });

      if (error) {
        document.getElementById('err').textContent = 'Invalid email or password.';
        go.disabled = false;
        go.textContent = 'Log in';
      } else {
        location.replace('index.html');
      }
    };
  </script>

</body>

</html>
